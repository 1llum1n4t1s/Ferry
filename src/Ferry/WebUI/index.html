<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferry</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <div id="app">
        <!-- サイドバー -->
        <div id="sidebar">
            <div id="peer-list"></div>
            <div id="sidebar-toolbar">
                <button class="ghost-btn" id="btn-add-member" title="Add Member">+</button>
                <button class="ghost-btn" id="btn-settings" title="Settings">&#9881;</button>
            </div>
        </div>

        <!-- コンテンツエリア -->
        <div id="content">
            <!-- チャットビュー -->
            <div id="chat-view" class="view">
                <div id="chat-header">
                    <div id="chat-peer-name">Select a member</div>
                    <div id="chat-peer-status"></div>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-attachments" class="hidden"></div>
                <div id="chat-input-area">
                    <button class="ghost-btn" id="btn-attach" title="Attach">&#128206;</button>
                    <input type="text" id="chat-input" placeholder="Type a message..." />
                    <button class="primary-btn" id="btn-send">&#10148;</button>
                </div>
            </div>

            <!-- 設定ビュー -->
            <div id="settings-view" class="view hidden">
                <div id="settings-content"></div>
            </div>

            <!-- 空ビュー（ピア未選択時） -->
            <div id="empty-view" class="view">
                <div class="empty-message" id="empty-text">Select a member to start chatting</div>
            </div>
        </div>
    </div>

    <script src="js/bridge.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
