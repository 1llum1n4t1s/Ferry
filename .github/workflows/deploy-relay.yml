name: Deploy Relay

# infra/cloudflare/relay/ 配下を main に push したら relay Worker (Cloudflare Workers + Durable Objects)
# を自動デプロイする。手動 `wrangler deploy` 忘れによる「コードと本番の乖離」を防ぐ。
#
# 再発防止の背景 (2026-06-23): relay は手動デプロイのみで、PR #10 (/auth/token 追加) 後に
# 誰も再デプロイせず数日放置された結果、本番 relay が旧コードのまま /auth/token を 426 で
# 弾き続けた (24h で 433 回)。リリースに紐づかない手動運用が構造的原因だったため CI 化する。
#
# Velopack 配信 (release/**) や landing (web/) のパイプラインとは完全に独立。
# secret (SALT / SESSION_HMAC_SECRET) は Worker に永続するので、
# コードデプロイ (`wrangler deploy`) では再設定不要。
#
# rere レビュー #C-05: 旧実装は wrangler を global install して deploy するだけで、
# 型チェックも vitest も一切通していなかった (全 workflow を通しても relay の TS を
# 検証する経路がゼロで、6 本のテストスイートが一度も走っていなかった)。
# 型エラー・テスト失敗のまま本番へ即配信できる状態だったため、deploy の前段に
# CLAUDE.md 規定の検証コマンド (tsc --noEmit && vitest) を必須ゲートとして置く。
# PR 段階の検証は relay-check.yml が担当する。
on:
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare/relay/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

# rere レビュー #C-05: 連続 push でデプロイ順が入れ替わらないよう直列化する
# (cancel-in-progress は使わない。走行中の deploy を中断すると中途半端な配信になりうる)。
concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy relay Worker
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # zizmor: artipacked 警告対策。push しないので資格情報を残さない。
          persist-credentials: false

      - name: Node.js セットアップ (wrangler 4.x が Node.js >=20 を要求)
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      # rere レビュー #C-05: wrangler を global install するとバージョンが lockfile と
      # 二重管理になる (旧実装は global 4.93.0 / lockfile 4.106.0 で、本番デプロイだけ
      # 古い CLI が使われていた)。pnpm を固定して lockfile 経由で解決し、単一の正本にする。
      - name: pnpm をインストール (サプライチェーン対策でバージョン固定)
        run: npm install -g pnpm@11.4.0

      - name: 依存をインストール (lockfile 固定)
        working-directory: infra/cloudflare/relay
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        working-directory: infra/cloudflare/relay
        run: pnpm exec tsc --noEmit

      - name: テスト
        working-directory: infra/cloudflare/relay
        run: pnpm test

      # CLOUDFLARE_API_TOKEN は Workers Scripts:Edit 権限が必要
      # (deploy-landing.yml と同じトークン。R2 Storage:Edit だけでは Worker デプロイ不可)。
      # wrangler deploy は wrangler.toml の [[migrations]] (= Durable Object クラスの
      # migration。D1 スキーマではない) を適用し、public/ (Static Assets = CF 版 Bridge)
      # も同時配信する。
      # ⚠️ D1 スキーマは wrangler deploy では適用されない。schema.sql の変更は
      #    `pnpm dlx wrangler d1 execute ferry_ledger --remote --file=schema.sql` を
      #    手動で先に流すこと (docs/operations/runbook.md 参照)。
      - name: relay Worker をデプロイ
        working-directory: infra/cloudflare/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
