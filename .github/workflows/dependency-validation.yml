name: Dependency validation
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dotnet:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.x
    - run: 'dotnet build Ferry.slnx -c Release

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        dotnet test --project tests/Ferry.Tests/Ferry.Tests.csproj -c Release --no-build

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
  relay:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.22.3
    - run: npm install --global pnpm@11.4.0
    - run: 'pnpm install --frozen-lockfile

        pnpm exec tsc --noEmit

        pnpm test'
      working-directory: infra/cloudflare/relay
