name: Dependency validation
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dotnet:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        dotnet-version: 11.0.x
    - run: 'dotnet build Ferry.slnx -c Release

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        dotnet test --project tests/Ferry.Tests/Ferry.Tests.csproj -c Release --no-build

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
  relay:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - name: Validate locked dependency policies
      working-directory: infra/cloudflare/relay
      run: |
        bun --no-env-file --no-install --bun run bun add --global --trust pnpm@12.16.1 --network-concurrency=4
        bun --no-env-file --no-install --bun run pnpm install --lockfile-only --frozen-lockfile --network-concurrency=4
    - run: 'bun --no-env-file --no-install --bun run bun install --frozen-lockfile --no-save --network-concurrency=4

        bun run --bun tsc --noEmit

        bun run --bun test'
      working-directory: infra/cloudflare/relay
