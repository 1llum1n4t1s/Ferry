name: Release
on:
  push:
    branches:
      - 'release/**'
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  version:
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Output version string
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
  velopack:
    needs: [build, version]
    name: Velopack
    uses: ./.github/workflows/velopack.yml
    with:
      version: ${{ needs.version.outputs.version }}
  r2-upload:
    needs: [package, velopack, version]
    name: R2 Upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package.*
          path: packages
          merge-multiple: true
      - name: Download Velopack artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: velopack.*
          path: velopack-packages
          merge-multiple: true
      - name: 成果物を確認
        run: |
          echo "=== インストーラ (packages/) ==="
          ls -lh packages/ || true
          echo "=== Velopack 自動更新フィード (velopack-packages/) ==="
          ls -lh velopack-packages/ || true
      - name: Node.js セットアップ (wrangler 4.x が Node.js >=22 を要求)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: wrangler CLI をインストール
        # サプライチェーン攻撃防止のため明示的にバージョン固定
        run: npm install -g wrangler@4.93.0
      - name: Velopack 自動更新フィードを R2 (ferry-updates) にアップロード
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          count=0
          for f in velopack-packages/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "::group::Upload (feed) $name"
            wrangler r2 object put "ferry-updates/$name" --file="$f" --remote
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "✅ Velopack フィード アップロード完了: $count ファイル"
      - name: インストーラを R2 (ferry-updates) にアップロード
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          count=0
          for f in packages/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "::group::Upload (installer) $name"
            wrangler r2 object put "ferry-updates/$name" --file="$f" --remote
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "✅ インストーラ アップロード完了: $count ファイル"
      - name: 配信確認 (全 channel の releases.<channel>.json HTTP 200 を検証)
        run: |
          set -euo pipefail
          base="https://ferry.nephilim.jp"
          for channel in win-x64 win-arm64 osx-arm64 linux-x64 linux-arm64; do
            url="${base}/releases.${channel}.json"
            curl --fail --silent --show-error --max-time 30 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 -o /dev/null -w "${channel}: HTTP %{http_code} (%{size_download} bytes)\n" \
                 "$url"
          done
  firebase-deploy:
    # release/X.Y.Z push 時に Firebase Hosting (Bridge ページ) も自動 deploy。
    # 別途手動 `firebase deploy --only hosting` を不要にする。
    # 要 Secrets: FIREBASE_TOKEN (`firebase login:ci` で取得、ローテーション不要な永続トークン)
    name: Firebase Hosting Deploy (Bridge)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Node.js セットアップ (firebase-tools が Node.js >=20 を要求)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: firebase-tools をインストール
        # サプライチェーン攻撃防止のため明示的にバージョン固定
        run: npm install -g firebase-tools@13.29.1
      - name: Bridge ページを Firebase Hosting にデプロイ
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::warning::FIREBASE_TOKEN が未設定です。Bridge ページの deploy をスキップしました。"
            echo "ローカルで 'firebase login:ci' を実行してトークンを取得し、GitHub Secrets に FIREBASE_TOKEN として登録してください。"
            exit 0
          fi
          cd src/Ferry.Bridge
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
          echo "✅ Bridge ページ deploy 完了: https://ferry-edf09.web.app/"
