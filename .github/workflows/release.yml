name: Release
on:
  push:
    branches:
      - 'release/**'

# 複数 release/** push が overlap した場合、古い run の cleanup step が新しい run が
# upload した nupkg を「manifest 外」として削除する race condition を起こしうるため、
# workflow level の concurrency で release ジョブを直列化する。
# cancel-in-progress: false にする理由: 削除途中で中断するとオブジェクト整合性が壊れるので、
# 走っている run を最後まで完走させて次の run を queue する (transfer-cf スキル 8-2.5 準拠)。
concurrency:
  group: release-r2
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted != true
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
  version:
    if: github.event.deleted != true
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Output version string
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      build-attempts: ${{ toJSON(needs.build.outputs) }}
  velopack:
    needs: [build, version]
    name: Velopack
    uses: ./.github/workflows/velopack.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build-attempts: ${{ toJSON(needs.build.outputs) }}
    # macOS (osx-arm64) の Developer ID 署名 + 公証で使う Apple クレデンシャルを明示渡し。
    # (最小権限: secrets: inherit ではなく velopack.yml が宣言した分だけ渡す)
    secrets:
      R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
      R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
      APPLE_CERT_APP_P12_BASE64: ${{ secrets.APPLE_CERT_APP_P12_BASE64 }}
      APPLE_CERT_INSTALLER_P12_BASE64: ${{ secrets.APPLE_CERT_INSTALLER_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
      APPLE_SIGN_INSTALL_IDENTITY: ${{ secrets.APPLE_SIGN_INSTALL_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
  r2-upload:
    needs: [build, package, velopack, version]
    name: R2 Upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verification gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Download package artifacts
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          BUILD_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.build.outputs) }}
          PACKAGE_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.package.outputs) }}
          VELOPACK_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.velopack.outputs) }}
        run: |
          $attempts = @{
            build = ($env:BUILD_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            package = ($env:PACKAGE_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            velopack = ($env:VELOPACK_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
          }
          $origins = @(
            @{ Name = 'package.windows-x64'; Runtime = 'win-x64'; Producer = 'package' },
            @{ Name = 'package.windows-arm64'; Runtime = 'win-arm64'; Producer = 'package' },
            @{ Name = 'package.macos-apple-silicon'; Runtime = 'osx-arm64'; Producer = 'package' },
            @{ Name = 'package.linux-x64'; Runtime = 'linux-x64'; Producer = 'package' },
            @{ Name = 'package.linux-arm64'; Runtime = 'linux-arm64'; Producer = 'package' }
          )
          foreach ($origin in $origins) {
            $attempt = $attempts[$origin.Producer][$origin.Runtime]
            & ./scripts/Receive-ReleaseArtifact.ps1 -Name $origin.Name -Destination 'packages' -RunAttempt $attempt
          }
        working-directory: ${{ github.workspace }}
      - name: Download Velopack artifacts
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          BUILD_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.build.outputs) }}
          PACKAGE_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.package.outputs) }}
          VELOPACK_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.velopack.outputs) }}
        run: |
          $attempts = @{
            build = ($env:BUILD_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            package = ($env:PACKAGE_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            velopack = ($env:VELOPACK_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
          }
          $origins = @(
            @{ Name = 'velopack.macos-apple-silicon'; Runtime = 'osx-arm64'; Producer = 'velopack' },
            @{ Name = 'velopack.linux-x64'; Runtime = 'linux-x64'; Producer = 'velopack' },
            @{ Name = 'velopack.linux-arm64'; Runtime = 'linux-arm64'; Producer = 'velopack' }
          )
          foreach ($origin in $origins) {
            $attempt = $attempts[$origin.Producer][$origin.Runtime]
            & ./scripts/Receive-ReleaseArtifact.ps1 -Name $origin.Name -Destination 'velopack-packages' -RunAttempt $attempt
          }
        working-directory: ${{ github.workspace }}
      - name: Download verification evidence
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          BUILD_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.build.outputs) }}
          PACKAGE_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.package.outputs) }}
          VELOPACK_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.velopack.outputs) }}
        run: |
          $attempts = @{
            build = ($env:BUILD_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            package = ($env:PACKAGE_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            velopack = ($env:VELOPACK_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
          }
          $origins = @(
            @{ Name = 'verification.package.win-x64'; Runtime = 'win-x64'; Producer = 'package' },
            @{ Name = 'verification.package.win-arm64'; Runtime = 'win-arm64'; Producer = 'package' },
            @{ Name = 'verification.package.osx-arm64'; Runtime = 'osx-arm64'; Producer = 'package' },
            @{ Name = 'verification.package.linux-x64'; Runtime = 'linux-x64'; Producer = 'package' },
            @{ Name = 'verification.package.linux-arm64'; Runtime = 'linux-arm64'; Producer = 'package' },
            @{ Name = 'verification.feed.osx-arm64'; Runtime = 'osx-arm64'; Producer = 'velopack' },
            @{ Name = 'verification.feed.linux-x64'; Runtime = 'linux-x64'; Producer = 'velopack' },
            @{ Name = 'verification.feed.linux-arm64'; Runtime = 'linux-arm64'; Producer = 'velopack' }
          )
          foreach ($origin in $origins) {
            $attempt = $attempts[$origin.Producer][$origin.Runtime]
            & ./scripts/Receive-ReleaseArtifact.ps1 -Name $origin.Name -Destination 'verification' -RunAttempt $attempt
          }
        working-directory: ${{ github.workspace }}
      - name: Download dependency evidence
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          BUILD_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.build.outputs) }}
          PACKAGE_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.package.outputs) }}
          VELOPACK_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.velopack.outputs) }}
        run: |
          $attempts = @{
            build = ($env:BUILD_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            package = ($env:PACKAGE_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            velopack = ($env:VELOPACK_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
          }
          $origins = @(
            @{ Name = 'deps.win-x64'; Runtime = 'win-x64'; Producer = 'build' },
            @{ Name = 'deps.win-arm64'; Runtime = 'win-arm64'; Producer = 'build' },
            @{ Name = 'deps.osx-arm64'; Runtime = 'osx-arm64'; Producer = 'build' },
            @{ Name = 'deps.linux-x64'; Runtime = 'linux-x64'; Producer = 'build' },
            @{ Name = 'deps.linux-arm64'; Runtime = 'linux-arm64'; Producer = 'build' }
          )
          foreach ($origin in $origins) {
            $attempt = $attempts[$origin.Producer][$origin.Runtime]
            & ./scripts/Receive-ReleaseArtifact.ps1 -Name $origin.Name -Destination 'dependencies' -RunAttempt $attempt
          }
        working-directory: ${{ github.workspace }}
      - name: 最初の R2 put 前に全配布実物を照合
        # 不一致なら認証情報を渡す upload step より前に停止する。
        env:
          PACKAGE_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.package.outputs) }}
          FEED_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.velopack.outputs) }}
        run: python3 build/scripts/verify-release.py aggregate --version '${{ needs.version.outputs.version }}' --root . --evidence verification
      - name: 最初の R2 put 前に既存同版の異内容上書きを拒否
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 build/scripts/verify-release.py remote --version '${{ needs.version.outputs.version }}' --root . --evidence verification
      - name: Publish verified artifacts to R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          . ./scripts/R2Distribution.Common.ps1
          $files = @(Get-ChildItem -Path 'packages', 'velopack-packages' -File)
          $metadata = '^(?:releases\..*\.json|assets\..*\.json|RELEASES(?:-.*)?)$'
          $ordered = @($files | Where-Object { $_.Name -notmatch $metadata }) + @($files | Where-Object { $_.Name -match $metadata })
          foreach ($file in $ordered) {
            $immutable = $file.Name -match '(?:\.nupkg$|[-_.]\d+\.\d+\.\d+(?:[-_.]|$))'
            $cacheControl = if ($immutable) { 'public, max-age=31536000, immutable' } else { 'no-cache, must-revalidate' }
            $contentType = switch -Regex ($file.Name) { '\.json$' { 'application/json'; break }; '^RELEASES' { 'text/plain'; break }; '\.(zip|nupkg)$' { 'application/zip'; break }; default { 'application/octet-stream' } }
            Publish-R2Object -AccountId $env:CLOUDFLARE_ACCOUNT_ID -Bucket 'ferry-updates' -FilePath $file.FullName -Immutable:$immutable -CacheControl $cacheControl -ContentType $contentType | Out-Null
          }
      # 旧バージョン nupkg のクリーンアップ (Aggressive 保持戦略 / transfer-cf スキル 8-3 準拠):
      # - releases.<channel>.json (manifest) に含まれない *.nupkg を削除
      # - Setup.exe / *.zip / *.deb / *.rpm / *.AppImage / RELEASES / assets.*.json /
      #   releases.*.json は固定ファイル名で毎リリース上書きされる Velopack 内部 &
      #   ランディング DL 用 (= packages/ 由来のインストーラ含む) なので保護
      # - 削除対象を「.nupkg かつ manifest 外」に絞ることで、想定外のファイル
      #   (誰かが手動 put した object) や packages/ 系インストーラを誤って消さない安全側設計
      # - アップロード完了後に走る (cleanup 内の manifest 取得不能時は削除しない)
      # - API: Cloudflare V4 で完結 (CLOUDFLARE_API_TOKEN だけで動く / R2 S3 互換 Access Key 不要)
      - name: 旧バージョン nupkg を削除 (manifest 外をクリーンアップ)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/ferry-updates"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          # 1. ローカル velopack-packages/ の manifest (= 今アップロードしたものと同一) から
          #    keep set を構築。public endpoint から fetch すると CDN/R2 の伝播タイミング次第で
          #    「アップロード前の旧 manifest」が返り、新 nupkg が keep_map に入らずに削除される
          #    race condition がある (transfer-cf スキル Codex P1 指摘対応)。ローカル artifact
          #    から読めば伝播遅延に依存しない。
          declare -A keep_map
          shopt -s nullglob
          local_manifests=(velopack-packages/releases.*.json)
          shopt -u nullglob

          if [[ "${#local_manifests[@]}" -eq 0 ]]; then
            echo "::error::velopack-packages/releases.*.json が見つかりません。Velopack 成果物のダウンロードに失敗している可能性があります。"
            exit 1
          fi

          for manifest_path in "${local_manifests[@]}"; do
            echo "Reading local manifest: $manifest_path"
            while IFS= read -r filename; do
              if [[ -n "$filename" && "$filename" != "null" ]]; then
                keep_map["$filename"]=1
              fi
            done < <(jq -r '.Assets[]?.FileName // empty' "$manifest_path")
          done

          # win-x64 / win-arm64 はローカル署名リリース (scripts/release-local.ps1) が配信する
          # ため CI 成果物には存在しない。R2 上の releases.win-*.json を keep set に取り込み、
          # 署名済み win nupkg を「manifest 外」と誤判定して削除しないようにする。
          # クエリ付き URL で CDN キャッシュをバイパスし、取得失敗時は誤削除防止のため
          # cleanup を安全側で中止する (release-local.ps1 側の osx/linux keep 取り込みと対称)。
          for channel in win-x64 win-arm64; do
            manifest_url="https://ferry.kagayoi.com/releases.${channel}.json?cb=$(date +%s)"
            if ! remote_json=$(curl --fail --silent --max-time 30 \
                 --retry 3 --retry-delay 5 --retry-all-errors "$manifest_url"); then
              echo "::error::releases.${channel}.json の取得に失敗しました。署名済み win nupkg の誤削除を防ぐため cleanup を中止します。"
              exit 1
            fi
            while IFS= read -r filename; do
              if [[ -n "$filename" && "$filename" != "null" ]]; then
                keep_map["$filename"]=1
              fi
            done < <(echo "$remote_json" | jq -r '.Assets[]?.FileName // empty')
          done

          echo "::group::manifest 内の保持対象 nupkg (${#keep_map[@]} files)"
          for k in "${!keep_map[@]}"; do echo "  $k"; done | sort
          echo "::endgroup::"

          # 2. R2 上の全 object を cursor ページネーション付きで取得
          #    継続判定は result_info.is_truncated を明示利用 (意図を明確化)
          all_keys=()
          cursor=""
          while true; do
            if [[ -n "$cursor" ]]; then
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000&cursor=${cursor}" -H "$auth_header")
            else
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000" -H "$auth_header")
            fi
            while IFS= read -r k; do
              [[ -n "$k" ]] && all_keys+=("$k")
            done < <(echo "$resp" | jq -r '.result[]?.key')
            truncated=$(echo "$resp" | jq -r '.result_info.is_truncated // false')
            [[ "$truncated" != "true" ]] && break
            cursor=$(echo "$resp" | jq -r '.result_info.cursor // ""')
            [[ -z "$cursor" || "$cursor" == "null" ]] && break
          done

          echo "::group::R2 内全オブジェクト (${#all_keys[@]} files)"
          printf '  %s\n' "${all_keys[@]}"
          echo "::endgroup::"

          # 3. 削除対象判定: 「manifest 外 かつ バージョン文字列付き かつ 直近 N 世代以外」
          #    ⚠️ 旧実装は .nupkg だけを対象にしていたため、package.yml が生成する
          #       バージョン付き配布物 (ferry_x.y.z.zip / .deb / .rpm / ferry-x.y.z.AppImage)
          #       が一切消えず、1.0.31〜1.0.69 の 39 世代 351 個 = 7.2GB が R2 に滞留した
          #       (2026-07 実測。R2 含有枠 10GB の 72% を 1 バケットで消費していた)。
          #    固定ファイル名 (Ferry-*-Setup.exe / Ferry-*-Portable.zip / Ferry-linux-*.AppImage /
          #    Ferry-osx-arm64-Setup.pkg / RELEASES* / assets.*.json / releases.*.json) は
          #    バージョン文字列を含まないので対象外 = ランディングページの DL リンクは無傷。
          #    grep が無一致で終わると pipefail で job が落ちるため || true で吸収する。
          KEEP_VERSIONS=2
          declare -A keep_version_map
          mapfile -t all_versions < <(printf '%s\n' "${all_keys[@]}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V -u || true)
          if [[ "${#all_versions[@]}" -gt 0 ]]; then
            start=$(( ${#all_versions[@]} - KEEP_VERSIONS ))
            (( start < 0 )) && start=0
            for v in "${all_versions[@]:$start}"; do keep_version_map["$v"]=1; done
          fi
          echo "保持バージョン: ${!keep_version_map[*]} (R2 上の全 ${#all_versions[@]} 世代のうち直近 ${KEEP_VERSIONS} 世代)"

          to_delete=()
          for key in "${all_keys[@]}"; do
            # manifest が参照するファイルは絶対保持 (消すと自動更新が壊れる)
            [[ -n "${keep_map[$key]:-}" ]] && continue
            # 固定ファイル名はバージョン文字列を含まない = 毎リリース上書きなので保持
            ver=$(printf '%s' "$key" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
            [[ -z "$ver" ]] && continue
            [[ -n "${keep_version_map[$ver]:-}" ]] && continue
            to_delete+=("$key")
          done

          if [[ "${#to_delete[@]}" -eq 0 ]]; then
            echo "✅ 削除対象なし - R2 上のバージョン付きファイルは manifest 参照分と直近 ${KEEP_VERSIONS} 世代のみです"
            exit 0
          fi

          echo "::group::削除対象 (${#to_delete[@]} files)"
          printf '  %s\n' "${to_delete[@]}"
          echo "::endgroup::"

          # 4. 一個ずつ DELETE
          #    --max-time 30 でハング防止 (他の curl 呼び出しと統一)
          deleted=0
          failed=0
          for key in "${to_delete[@]}"; do
            encoded=$(jq -nr --arg k "$key" '$k|@uri')
            resp=$(curl --silent --max-time 30 -X DELETE "${api}/objects/${encoded}" -H "$auth_header")
            success=$(echo "$resp" | jq -r '.success')
            if [[ "$success" == "true" ]]; then
              echo "  🗑️  Deleted: $key"
              deleted=$((deleted + 1))
            else
              echo "  ❌ Failed: $key"
              echo "$resp" | jq -r '.errors[]?.message' | sed 's/^/      /'
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "🧹 R2 クリーンアップ完了: $deleted / ${#to_delete[@]} 削除  (失敗: $failed)"
          # rere レビュー #C-38: 旧実装は「全件失敗」のときだけ exit 1 にしていたため、
          # 100 件中 99 件が失敗しても job はグリーンだった。恒久的に削除できないキー
          # (URI エンコード不整合・権限不足・オブジェクトロック等) は再試行しても永久に
          # 失敗するので、「次回リリースで再試行される」という前提が成り立たない。
          # 実際 1.0.31〜1.0.69 の 351 個 7.2GB が滞留して R2 含有枠の 72% を消費する事故が
          # 起きており、R2 使用量の監視もリポジトリ内に無い（気付く手段が他にない）。
          # 配信自体は完了しているのでリリースは失敗させないが、1 件でも失敗したら
          # ::warning:: を出してサマリに残し、全件失敗なら従来どおり ::error:: + exit 1 にする。
          if [[ "$failed" -gt 0 ]]; then
            if [[ "$deleted" -eq 0 ]]; then
              echo "::error::すべての削除が失敗しました。API token の権限・bucket 名を確認してください。"
              exit 1
            fi
            echo "::warning::R2 クリーンアップで $failed 件の削除に失敗しました。恒久失敗なら滞留し続けるので、上のログの ❌ 行を確認してください。"
            {
              echo "### ⚠️ R2 クリーンアップの部分失敗"
              echo ""
              echo "- 削除成功: $deleted 件 / 対象 ${#to_delete[@]} 件"
              echo "- **削除失敗: $failed 件**"
              echo ""
              echo "再試行で解消しない場合は R2 に滞留し続けます（含有枠を圧迫）。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
  # CF 単独完結 Step 6: Bridge ページは relay Worker の Static Assets（deploy-relay.yml）で配信するため、
  # Firebase Hosting への deploy job（firebase-deploy）は撤去した。src/Ferry.Bridge も削除済み。
