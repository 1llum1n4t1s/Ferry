name: Release
on:
  push:
    branches:
      - 'release/**'

# 複数 release/** push が overlap した場合、古い run の cleanup step が新しい run が
# upload した nupkg を「manifest 外」として削除する race condition を起こしうるため、
# workflow level の concurrency で release ジョブを直列化する。
# cancel-in-progress: false にする理由: 削除途中で中断するとオブジェクト整合性が壊れるので、
# 走っている run を最後まで完走させて次の run を queue する (transfer-cf スキル 8-2.5 準拠)。
concurrency:
  group: release-r2
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  version:
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Output version string
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
  velopack:
    needs: [build, version]
    name: Velopack
    uses: ./.github/workflows/velopack.yml
    with:
      version: ${{ needs.version.outputs.version }}
  r2-upload:
    needs: [package, velopack, version]
    name: R2 Upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package.*
          path: packages
          merge-multiple: true
      - name: Download Velopack artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: velopack.*
          path: velopack-packages
          merge-multiple: true
      - name: 成果物を確認
        run: |
          echo "=== インストーラ (packages/) ==="
          ls -lh packages/ || true
          echo "=== Velopack 自動更新フィード (velopack-packages/) ==="
          ls -lh velopack-packages/ || true
      - name: Node.js セットアップ (wrangler 4.x が Node.js >=22 を要求)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: wrangler CLI をインストール
        # サプライチェーン攻撃防止のため明示的にバージョン固定
        run: npm install -g wrangler@4.93.0
      - name: Velopack 自動更新フィードを R2 (ferry-updates) にアップロード
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          count=0
          for f in velopack-packages/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "::group::Upload (feed) $name"
            wrangler r2 object put "ferry-updates/$name" --file="$f" --remote
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "✅ Velopack フィード アップロード完了: $count ファイル"
      - name: インストーラを R2 (ferry-updates) にアップロード
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          count=0
          for f in packages/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "::group::Upload (installer) $name"
            wrangler r2 object put "ferry-updates/$name" --file="$f" --remote
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "✅ インストーラ アップロード完了: $count ファイル"
      - name: 配信確認 (全 channel の releases.<channel>.json HTTP 200 を検証)
        run: |
          set -euo pipefail
          base="https://ferry.nephilim.jp"
          for channel in win-x64 win-arm64 osx-arm64 linux-x64 linux-arm64; do
            url="${base}/releases.${channel}.json"
            curl --fail --silent --show-error --max-time 30 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 -o /dev/null -w "${channel}: HTTP %{http_code} (%{size_download} bytes)\n" \
                 "$url"
          done

      # 旧バージョン nupkg のクリーンアップ (Aggressive 保持戦略 / transfer-cf スキル 8-3 準拠):
      # - releases.<channel>.json (manifest) に含まれない *.nupkg を削除
      # - Setup.exe / *.zip / *.deb / *.rpm / *.AppImage / RELEASES / assets.*.json /
      #   releases.*.json は固定ファイル名で毎リリース上書きされる Velopack 内部 &
      #   ランディング DL 用 (= packages/ 由来のインストーラ含む) なので保護
      # - 削除対象を「.nupkg かつ manifest 外」に絞ることで、想定外のファイル
      #   (誰かが手動 put した object) や packages/ 系インストーラを誤って消さない安全側設計
      # - 配信確認ステップ後に走る (manifest 取得不能なら手前で fail し cleanup は走らない)
      # - API: Cloudflare V4 で完結 (CLOUDFLARE_API_TOKEN だけで動く / R2 S3 互換 Access Key 不要)
      - name: 旧バージョン nupkg を削除 (manifest 外をクリーンアップ)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/ferry-updates"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          # 1. ローカル velopack-packages/ の manifest (= 今アップロードしたものと同一) から
          #    keep set を構築。public endpoint から fetch すると CDN/R2 の伝播タイミング次第で
          #    「アップロード前の旧 manifest」が返り、新 nupkg が keep_map に入らずに削除される
          #    race condition がある (transfer-cf スキル Codex P1 指摘対応)。ローカル artifact
          #    から読めば伝播遅延に依存しない。
          declare -A keep_map
          shopt -s nullglob
          local_manifests=(velopack-packages/releases.*.json)
          shopt -u nullglob

          if [[ "${#local_manifests[@]}" -eq 0 ]]; then
            echo "::error::velopack-packages/releases.*.json が見つかりません。Velopack 成果物のダウンロードに失敗している可能性があります。"
            exit 1
          fi

          for manifest_path in "${local_manifests[@]}"; do
            echo "Reading local manifest: $manifest_path"
            while IFS= read -r filename; do
              if [[ -n "$filename" && "$filename" != "null" ]]; then
                keep_map["$filename"]=1
              fi
            done < <(jq -r '.Assets[]?.FileName // empty' "$manifest_path")
          done

          echo "::group::manifest 内の保持対象 nupkg (${#keep_map[@]} files)"
          for k in "${!keep_map[@]}"; do echo "  $k"; done | sort
          echo "::endgroup::"

          # 2. R2 上の全 object を cursor ページネーション付きで取得
          #    継続判定は result_info.is_truncated を明示利用 (意図を明確化)
          all_keys=()
          cursor=""
          while true; do
            if [[ -n "$cursor" ]]; then
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000&cursor=${cursor}" -H "$auth_header")
            else
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000" -H "$auth_header")
            fi
            while IFS= read -r k; do
              [[ -n "$k" ]] && all_keys+=("$k")
            done < <(echo "$resp" | jq -r '.result[]?.key')
            truncated=$(echo "$resp" | jq -r '.result_info.is_truncated // false')
            [[ "$truncated" != "true" ]] && break
            cursor=$(echo "$resp" | jq -r '.result_info.cursor // ""')
            [[ -z "$cursor" || "$cursor" == "null" ]] && break
          done

          echo "::group::R2 内全オブジェクト (${#all_keys[@]} files)"
          printf '  %s\n' "${all_keys[@]}"
          echo "::endgroup::"

          # 3. 削除対象判定: 拡張子 .nupkg のもののみ対象 + keep_map 外
          #    Ferry の packages/ 由来 (deb/rpm/AppImage/zip 等のインストーラ) は
          #    .nupkg 拡張子ではないので絶対に削除対象にならない
          to_delete=()
          for key in "${all_keys[@]}"; do
            [[ "$key" != *.nupkg ]] && continue
            [[ -n "${keep_map[$key]:-}" ]] && continue
            to_delete+=("$key")
          done

          if [[ "${#to_delete[@]}" -eq 0 ]]; then
            echo "✅ 削除対象なし - R2 上の全 nupkg が manifest に含まれています"
            exit 0
          fi

          echo "::group::削除対象 (${#to_delete[@]} files)"
          printf '  %s\n' "${to_delete[@]}"
          echo "::endgroup::"

          # 4. 一個ずつ DELETE
          #    --max-time 30 でハング防止 (他の curl 呼び出しと統一)
          deleted=0
          failed=0
          for key in "${to_delete[@]}"; do
            encoded=$(jq -nr --arg k "$key" '$k|@uri')
            resp=$(curl --silent --max-time 30 -X DELETE "${api}/objects/${encoded}" -H "$auth_header")
            success=$(echo "$resp" | jq -r '.success')
            if [[ "$success" == "true" ]]; then
              echo "  🗑️  Deleted: $key"
              deleted=$((deleted + 1))
            else
              echo "  ❌ Failed: $key"
              echo "$resp" | jq -r '.errors[]?.message' | sed 's/^/      /'
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "🧹 R2 クリーンアップ完了: $deleted / ${#to_delete[@]} 削除  (失敗: $failed)"
          # 失敗があってもリリース自体は成功扱い (削除失敗は次回リリースで再試行される)
          # ただし全件失敗の場合はワークフロー失敗にして気付けるようにする
          if [[ "$failed" -gt 0 && "$deleted" -eq 0 ]]; then
            echo "::error::すべての削除が失敗しました。API token の権限・bucket 名を確認してください。"
            exit 1
          fi
  firebase-deploy:
    # release/X.Y.Z push 時に Firebase Hosting (Bridge ページ) も自動 deploy。
    # 別途手動 `firebase deploy --only hosting` を不要にする。
    # 要 Secrets: FIREBASE_TOKEN (`firebase login:ci` で取得、ローテーション不要な永続トークン)
    name: Firebase Hosting Deploy (Bridge)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Node.js セットアップ (firebase-tools が Node.js >=20 を要求)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: firebase-tools をインストール
        # サプライチェーン攻撃防止のため明示的にバージョン固定
        run: npm install -g firebase-tools@13.29.1
      - name: Bridge ページを Firebase Hosting にデプロイ
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            # rere レビュー #F-006: 旧 exit 0 だと release 全体が成功扱いになり Bridge
            # プロトコル変更入りのリリースで全ユーザーがペアリング不能でも誰も気付けない
            echo "::error::FIREBASE_TOKEN が未設定です。Bridge / database rules の deploy は必須。"
            echo "ローカルで 'firebase login:ci' を実行してトークンを取得し、GitHub Secrets に FIREBASE_TOKEN として登録してください。"
            exit 1
          fi
          cd src/Ferry.Bridge
          # rere レビュー #A1-004 / #A2-006: database.rules.json も同時 deploy で
          # 匿名 R/W 遮断ルールをリポジトリ管理下に置く (rules ドリフト防止)
          firebase deploy --only hosting,database --token "$FIREBASE_TOKEN" --non-interactive
          echo "✅ Bridge ページ + database rules deploy 完了: https://ferry-edf09.web.app/"
