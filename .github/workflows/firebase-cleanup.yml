name: Firebase ゴミセッション定期削除

on:
  schedule:
    # 6時間おきに実行（UTC 0,6,12,18時）
    - cron: '0 */6 * * *'
  workflow_dispatch: # 手動実行も可能

# rere レビュー #A2-009: workflow level の最小権限を明示。
# このジョブは Firebase REST へ curl するだけで repo contents への write 不要
permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 古い Firebase データを削除
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        shell: bash
        run: |
          # 6時間前のタイムスタンプ（ミリ秒）
          THRESHOLD=$(( ($(date +%s) - 21600) * 1000 ))
          echo "削除閾値: $(date -d @$(( THRESHOLD / 1000 )) -u '+%Y-%m-%d %H:%M:%S UTC')"

          cleanup_node() {
            local node="$1"
            echo "--- ${node} をチェック中 ---"

            # 全エントリを取得
            local data
            data=$(curl -sf "${FIREBASE_DB_URL}/${node}.json")

            if [ "$data" = "null" ] || [ -z "$data" ]; then
              echo "  データなし、スキップ"
              return
            fi

            # 各キーの CreatedAt/createdAt を確認し、古ければ削除
            echo "$data" | jq -r 'to_entries[] | select(
              (.value.CreatedAt // .value.createdAt // 0) < '"$THRESHOLD"' and
              (.value.CreatedAt // .value.createdAt // 0) > 0
            ) | .key' | while read -r key; do
              echo "  削除: ${node}/${key}"
              curl -sf -X DELETE "${FIREBASE_DB_URL}/${node}/${key}.json" > /dev/null
            done

            echo "  完了"
          }

          # Codex P2 (firebase-cleanup.yml:40-43): ProbeRouteAsync が finally に到達せず中断
          # (process kill / network hang / crash) した場合、signaling/<pairId>/probeOffers/<nonce> と
          # probeAnswers/<nonce> が残骸として残る。これらは top-level の signaling/<pairId>/createdAt
          # を見ない probe-only セッションでは cleanup_node "signaling" の判定 (`>0` filter) で
          # スキップされてしまい、ListenForIncomingConnectionAsync が再起動後に stale offer を
          # 拾って TCP probe timeout 5s 分を空回しする原因になる。
          # per-nonce の CreatedAt (TimedSignalingValue.CreatedAt) を見て個別に削除する。
          cleanup_probe_subtree() {
            local subnode="$1"  # "probeOffers" または "probeAnswers"
            echo "--- signaling/*/${subnode} をチェック中 ---"

            local sig
            sig=$(curl -sf "${FIREBASE_DB_URL}/signaling.json?shallow=true")
            if [ "$sig" = "null" ] || [ -z "$sig" ]; then
              echo "  signaling/ データなし、スキップ"
              return
            fi

            echo "$sig" | jq -r 'keys[]' | while read -r pair_id; do
              local probe_data
              probe_data=$(curl -sf "${FIREBASE_DB_URL}/signaling/${pair_id}/${subnode}.json")
              if [ "$probe_data" = "null" ] || [ -z "$probe_data" ]; then
                continue
              fi

              echo "$probe_data" | jq -r 'to_entries[] | select(
                (.value.CreatedAt // 0) < '"$THRESHOLD"' and
                (.value.CreatedAt // 0) > 0
              ) | .key' | while read -r nonce; do
                echo "  削除: signaling/${pair_id}/${subnode}/${nonce}"
                curl -sf -X DELETE "${FIREBASE_DB_URL}/signaling/${pair_id}/${subnode}/${nonce}.json" > /dev/null
              done
            done

            echo "  完了"
          }

          cleanup_node "sessions"
          cleanup_node "pairings"
          cleanup_node "signaling"
          # nested probe nodes は cleanup_node の top-level CreatedAt 判定では取りこぼすため別途
          cleanup_probe_subtree "probeOffers"
          cleanup_probe_subtree "probeAnswers"

          echo "=== クリーンアップ完了 ==="
