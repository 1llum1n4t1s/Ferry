name: .NET Build

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      build_only:
        description: "CIビルドの修正だけを検証し、テストの重複実行を省く"
        type: boolean
        default: false
      all_rids:
        description: "release と同じ 5 RID・コンテナ構成で発行する(PR 既定は win-x64 と linux-x64 のみ)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# rere レビュー #A2-009: workflow level の最小権限を明示
permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    # PR の検証は Native AOT の発行が通ることを win-x64 と linux-x64 で確認する。
    # 5 RID すべての発行と配布物の検証は release.yml が引き続き担当する。
    # 手動実行で all_rids を選ぶと release と同じ全 RID・コンテナ構成で検証できる。
    with:
      rids: ${{ (github.event_name == 'workflow_dispatch' && inputs.all_rids) && 'all' || 'win-x64,linux-x64' }}
      fast: ${{ !(github.event_name == 'workflow_dispatch' && inputs.all_rids) }}
    secrets: inherit
  test:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]
    # 公開リポジトリなので全 OS を GitHub 提供ランナーで動かす（matrix 名と実体が一致する）。
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify R2 transfer protocol offline
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x
          # NuGet のパッケージ取得を lockfile 単位で再利用する(この job は資格情報を扱わない)
          cache: true
          cache-dependency-path: |
            src/Ferry/packages.lock.json
            tests/Ferry.Tests/packages.lock.json
      - name: Test
        run: dotnet test tests/Ferry.Tests/Ferry.Tests.csproj
