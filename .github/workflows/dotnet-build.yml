name: .NET Build

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# rere レビュー #A2-009: workflow level の最小権限を明示
permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
