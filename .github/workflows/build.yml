name: Build
on:
  workflow_call:

# rere レビュー #A2-009: workflow level の最小権限を明示。
# reusable workflow は呼び出し元 (release.yml) の permissions を継承するが、
# 明示しておくと repo の default token permissions が変わっても安全側を維持できる
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            runtime: win-x64
          - name: Windows ARM64
            os: windows-2022
            runtime: win-arm64
          - name: macOS (Apple Silicon)
            os: macos-latest
            runtime: osx-arm64
          - name: Linux
            os: ubuntu-latest
            runtime: linux-x64
            container: ubuntu:20.04
          - name: Linux (arm64)
            os: ubuntu-latest
            runtime: linux-arm64
            container: ubuntu:20.04
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install common CLI tools
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y sudo
          sudo apt-get install -y curl wget git unzip zip libicu66 tzdata clang \
            libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Configure arm64 packages
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture arm64
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-updates main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-backports main restricted' \
          | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo sed -i -e 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo sed -i -e 's/^deb mirror/deb [arch=amd64] mirror/g' /etc/apt/sources.list
      - name: Install cross-compiling dependencies
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm gcc-aarch64-linux-gnu
      - name: Generate macOS icon
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          chmod +x build/scripts/generate-icns.sh
          ./build/scripts/generate-icns.sh
      - name: Build
        run: dotnet build -c Release
      - name: Publish
        run: dotnet publish src/Ferry/Ferry.csproj -c Release -o publish -r ${{ matrix.runtime }}
      # rere レビュー #C-26: 依存グラフ（transitive 込み）を成果物として残す。
      # 直接依存は csproj で固定文字列だが、NuGet の Version="x.y.z" は「最小バージョン」なので
      # transitive は restore のたびに解決し直される。上流が差し替えられても検知手段が無く、
      # 障害時に「どの依存で壊れたか」を過去のリリースと突き合わせられなかった。
      # ⚠️ packages.lock.json は使えない: NuGet の lock は Configuration を区別しないため、
      #    Debug 限定参照 (AvaloniaUI.DiagnosticsSupport) と Release 限定の AOT パッケージ
      #    (ILCompiler / ILLink) が Debug↔Release の切替のたびに lock を書き換えてしまう。
      #    RID 別 publish (5 ランタイム) も同様。記録だけを残す形にする。
      - name: Record dependency graph
        run: dotnet list src/Ferry/Ferry.csproj package --include-transitive > "deps.${{ matrix.runtime }}.txt"
      - name: Upload dependency graph
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps.${{ matrix.runtime }}
          path: deps.${{ matrix.runtime }}.txt
          retention-days: 90
      - name: Rename executable file
        if: startsWith(matrix.runtime, 'linux-')
        run: mv publish/Ferry publish/ferry
      - name: Include generated resources in publish
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          mkdir -p publish/_resources
          cp build/resources/app/App.icns publish/_resources/App.icns
      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-') || startsWith(matrix.runtime, 'osx-')
        run: |
          tar -cvf "ferry.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "ferry.${{ matrix.runtime }}.tar" publish
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferry.${{ matrix.runtime }}
          path: publish/*
          retention-days: 3
