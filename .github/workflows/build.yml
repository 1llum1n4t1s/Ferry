name: Build
on:
  workflow_call:
    outputs:
      win-x64:
        value: ${{ jobs['build'].outputs['win-x64'] }}
      win-arm64:
        value: ${{ jobs['build'].outputs['win-arm64'] }}
      osx-arm64:
        value: ${{ jobs['build'].outputs['osx-arm64'] }}
      linux-x64:
        value: ${{ jobs['build'].outputs['linux-x64'] }}
      linux-arm64:
        value: ${{ jobs['build'].outputs['linux-arm64'] }}

# rere レビュー #A2-009: workflow level の最小権限を明示。
# reusable workflow は呼び出し元 (release.yml) の permissions を継承するが、
# 明示しておくと repo の default token permissions が変わっても安全側を維持できる
permissions:
  contents: read

jobs:
  build:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      win-x64: ${{ steps.artifact-attempt.outputs['win-x64'] }}
      win-arm64: ${{ steps.artifact-attempt.outputs['win-arm64'] }}
      osx-arm64: ${{ steps.artifact-attempt.outputs['osx-arm64'] }}
      linux-x64: ${{ steps.artifact-attempt.outputs['linux-x64'] }}
      linux-arm64: ${{ steps.artifact-attempt.outputs['linux-arm64'] }}
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            runtime: win-x64
          - name: Windows ARM64
            os: windows-2022
            runtime: win-arm64
          - name: macOS (Apple Silicon)
            os: macos-latest
            runtime: osx-arm64
          - name: Linux
            os: ubuntu-latest
            runtime: linux-x64
            container: ubuntu:20.04
          - name: Linux (arm64)
            os: ubuntu-latest
            runtime: linux-arm64
            container: ubuntu:20.04
    name: Build ${{ matrix.name }}
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'windows-') && format('["{0}"]', matrix.os) || startsWith(matrix.os, 'macos-') && '["self-hosted","macOS","ARM64","m3mb14"]' || endsWith(matrix.os, '-arm') && '["self-hosted","Linux","ARM64","m3mb14"]' || '["self-hosted","Linux","X64","m3mb14"]') }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install common CLI tools
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y sudo
          sudo apt-get install -y curl wget git unzip zip libicu66 tzdata clang \
            libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install PowerShell in Linux container
        if: startsWith(matrix.runtime, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          version=7.4.13
          archive=powershell-$version-linux-x64.tar.gz
          curl --fail --location --silent --show-error "https://github.com/PowerShell/PowerShell/releases/download/v$version/$archive" -o "$RUNNER_TEMP/$archive"
          echo "59e5df675dacbfe45374c32c1bf2480168a33243423c9b19252d0476fd1b748c  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p /opt/powershell
          tar -xzf "$RUNNER_TEMP/$archive" -C /opt/powershell
          chmod +x /opt/powershell/pwsh
          echo /opt/powershell >> "$GITHUB_PATH"
      - name: Checkout sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Setup .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windows = $env:RUNNER_OS -eq 'Windows'
          $sdkVersion = $null
          if (Test-Path global.json) {
            $settings = Get-Content global.json -Raw | ConvertFrom-Json -AsHashtable
            if ($settings.ContainsKey('sdk') -and $settings['sdk'] -is [Collections.IDictionary] -and $settings['sdk'].ContainsKey('version')) {
              $sdkVersion = [string]$settings['sdk']['version']
            }
          }
          $extension = if ($windows) { 'ps1' } else { 'sh' }
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.$extension"
          Invoke-WebRequest "https://dot.net/v1/dotnet-install.$extension" -OutFile $installer
          $install = Join-Path $env:RUNNER_TEMP 'dotnet'
          $global:LASTEXITCODE = 0
          if ($windows) {
            if ($sdkVersion) { & $installer -Version $sdkVersion -InstallDir $install }
            else { & $installer -Channel '10.0' -InstallDir $install }
          } else {
            if ($sdkVersion) { & bash $installer --version $sdkVersion --install-dir $install }
            else { & bash $installer --channel '10.0' --install-dir $install }
          }
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK installation failed' }
          $dotnetName = if ($windows) { 'dotnet.exe' } else { 'dotnet' }
          $dotnet = Join-Path $install $dotnetName
          if (-not (Test-Path -LiteralPath $dotnet -PathType Leaf)) { throw '.NET SDK executable is missing' }
          & $dotnet --version
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK version check failed' }
          & $dotnet --info
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK runtime check failed' }
          $install | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$install" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure arm64 packages
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture arm64
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-updates main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-backports main restricted' \
          | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo sed -i -e 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo sed -i -e 's/^deb mirror/deb [arch=amd64] mirror/g' /etc/apt/sources.list
      - name: Install cross-compiling dependencies
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm gcc-aarch64-linux-gnu
      - name: Generate macOS icon
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          chmod +x build/scripts/generate-icns.sh
          ./build/scripts/generate-icns.sh
      - name: Build
        run: dotnet build -c Release
      - name: Publish
        run: dotnet publish src/Ferry/Ferry.csproj -c Release -o publish -r ${{ matrix.runtime }}
      # rere レビュー #C-26: 依存グラフ（transitive 込み）を成果物として残す。
      # 直接依存は csproj で固定文字列だが、NuGet の Version="x.y.z" は「最小バージョン」なので
      # transitive は restore のたびに解決し直される。上流が差し替えられても検知手段が無く、
      # 障害時に「どの依存で壊れたか」を過去のリリースと突き合わせられなかった。
      # ⚠️ packages.lock.json は使えない: NuGet の lock は Configuration を区別しないため、
      #    Debug 限定参照 (AvaloniaUI.DiagnosticsSupport) と Release 限定の AOT パッケージ
      #    (ILCompiler / ILLink) が Debug↔Release の切替のたびに lock を書き換えてしまう。
      #    RID 別 publish (5 ランタイム) も同様。記録だけを残す形にする。
      - name: Record dependency graph
        run: dotnet list src/Ferry/Ferry.csproj package --include-transitive > "deps.${{ matrix.runtime }}.txt"
      - name: Upload dependency graph
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'deps.${{ matrix.runtime }}' -Path 'deps.${{ matrix.runtime }}.txt' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Rename executable file
        if: startsWith(matrix.runtime, 'linux-')
        run: mv publish/Ferry publish/ferry
      - name: Include generated resources in publish
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          mkdir -p publish/_resources
          cp build/resources/app/App.icns publish/_resources/App.icns
      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-') || startsWith(matrix.runtime, 'osx-')
        run: |
          tar -cvf "ferry.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "ferry.${{ matrix.runtime }}.tar" publish
      - name: Upload artifact
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'ferry.${{ matrix.runtime }}' -Path 'publish/*' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Record artifact producer attempt
        id: artifact-attempt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_RUNTIME: ${{ matrix.runtime }}
        run: |
          printf '%s=%s\n' "$ARTIFACT_RUNTIME" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
