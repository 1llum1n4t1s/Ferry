name: Velopack
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

# rere レビュー #A2-009: workflow level の最小権限を明示
permissions:
  contents: read

jobs:
  velopack:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            label: windows-x64
            os: windows-2022
            mainExe: Ferry.exe
          - runtime: win-arm64
            label: windows-arm64
            os: windows-2022
            mainExe: Ferry.exe
          - runtime: osx-arm64
            label: macos-apple-silicon
            os: macos-latest
            mainExe: Ferry
          - runtime: linux-x64
            label: linux-x64
            os: ubuntu-latest
            mainExe: ferry
          - runtime: linux-arm64
            label: linux-arm64
            os: ubuntu-latest
            mainExe: ferry
    name: Velopack ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Checkout app metadata
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: |
            build/resources/app/App.plist
            build/resources/_common/icons/ferry.png
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ferry.${{ matrix.runtime }}
          path: publish
      - name: Extract tar
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        run: |
          tar -xf publish/ferry.${{ matrix.runtime }}.tar -C publish
          rm publish/ferry.${{ matrix.runtime }}.tar
      - name: Extract generated resources
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          cp publish/_resources/App.icns build/resources/app/App.icns
          rm -rf publish/_resources
      - name: Prepare macOS app metadata
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          sed "s/FERRY_VERSION/${{ inputs.version }}/g" build/resources/app/App.plist > Info.plist
      - name: Install Velopack CLI
        run: dotnet tool install --global vpk
      - name: Create Velopack package (Windows)
        if: startsWith(matrix.runtime, 'win-')
        run: vpk pack --packId Ferry --packVersion ${{ inputs.version }} --mainExe ${{ matrix.mainExe }} --packDir publish --outputDir artifacts --channel ${{ matrix.runtime }}
      - name: Create Velopack package (Linux)
        if: startsWith(matrix.runtime, 'linux-')
        run: >
          vpk pack
          --packId Ferry
          --packVersion ${{ inputs.version }}
          --mainExe ${{ matrix.mainExe }}
          --packDir publish
          --outputDir artifacts
          --channel ${{ matrix.runtime }}
          --icon build/resources/_common/icons/ferry.png
      - name: Create Velopack package (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        run: >
          vpk pack
          --packId Ferry
          --packVersion ${{ inputs.version }}
          --mainExe ${{ matrix.mainExe }}
          --packDir publish
          --outputDir artifacts
          --channel ${{ matrix.runtime }}
          --icon build/resources/app/App.icns
          --plist Info.plist
      - name: Upload Velopack artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: velopack.${{ matrix.label }}
          path: artifacts/*
          retention-days: 3
