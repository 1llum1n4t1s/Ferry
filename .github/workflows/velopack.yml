name: Velopack
on:
  workflow_call:
    outputs:
      osx-arm64:
        value: ${{ jobs['velopack'].outputs['osx-arm64'] }}
      linux-x64:
        value: ${{ jobs['velopack'].outputs['linux-x64'] }}
      linux-arm64:
        value: ${{ jobs['velopack'].outputs['linux-arm64'] }}
    inputs:
      build-attempts:
        description: Exact producer attempt for each build runtime
        required: true
        type: string
      version:
        required: true
        type: string
    # macOS (osx-arm64) の Developer ID 署名 + notarytool 公証で使う Apple クレデンシャル。
    # win-x64 / win-arm64 はローカル署名 (scripts/release-local.ps1)、linux は署名不要のため、
    # これらの secret は osx ジョブのみが参照する。未投入だと未署名 pkg が Gatekeeper に
    # 弾かれるため、osx ジョブは APPLE_CERT_APP_P12_BASE64 が空なら明示的に fail する。
    # 公証は app-specific password 方式 (Apple ID + Team ID + アプリ用パスワード)。
    # ※ App Store Connect API キー (.p8) 方式は Team Key + Developer 権限が必須で、個人キー/
    #   権限不足だと notarytool が invalidAsn1 を返すため、確実な app-specific password 方式を採用。
    secrets:
      R2_ARTIFACT_ACCESS_KEY_ID:
        required: true
      R2_ARTIFACT_SECRET_ACCESS_KEY:
        required: true
      APPLE_CERT_APP_P12_BASE64:
        required: false   # DeveloperID_Application.p12 (.app 署名用) の base64
      APPLE_CERT_INSTALLER_P12_BASE64:
        required: false   # DeveloperID_Installer.p12 (.pkg 署名用) の base64
      APPLE_CERT_PASSWORD:
        required: false   # 上記 .p12 のエクスポート時パスワード (両 p12 共通)
      APPLE_SIGN_APP_IDENTITY:
        required: false   # 例: "Developer ID Application: Yuichiro Shinozaki (TEAMID)"
      APPLE_SIGN_INSTALL_IDENTITY:
        required: false   # 例: "Developer ID Installer: Yuichiro Shinozaki (TEAMID)"
      APPLE_ID:
        required: false   # 公証用 Apple ID (メールアドレス)
      APPLE_TEAM_ID:
        required: false   # 10 桁の Team ID (例: SL228Y8UUR)
      APPLE_APP_PASSWORD:
        required: false   # appleid.apple.com で発行した app-specific password

# rere レビュー #A2-009: workflow level の最小権限を明示
permissions:
  contents: read

jobs:
  velopack:
    outputs:
      osx-arm64: ${{ steps.artifact-attempt.outputs['osx-arm64'] }}
      linux-x64: ${{ steps.artifact-attempt.outputs['linux-x64'] }}
      linux-arm64: ${{ steps.artifact-attempt.outputs['linux-arm64'] }}
    strategy:
      # 1 つの runtime (osx の署名等) が失敗しても linux チャンネルの発行を巻き込まない
      fail-fast: false
      matrix:
        # win-x64 / win-arm64 はローカル署名リリース (scripts/release-local.ps1) に移行済み。
        # CI で未署名の win フィードを生成すると、署名済みバイナリを R2 上で上書きして
        # しまうため matrix から除外している (コード署名は SimplySign Desktop 接続が必要で
        # GitHub Actions からは実行できない)。
        include:
          - runtime: osx-arm64
            label: macos-apple-silicon
            os: macos-latest
            mainExe: Ferry
          - runtime: linux-x64
            label: linux-x64
            os: ubuntu-latest
            mainExe: ferry
          - runtime: linux-arm64
            label: linux-arm64
            os: ubuntu-latest
            mainExe: ferry
    name: Velopack ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windows = $env:RUNNER_OS -eq 'Windows'
          $sdkVersion = $null
          if (Test-Path global.json) {
            $settings = Get-Content global.json -Raw | ConvertFrom-Json -AsHashtable
            if ($settings.ContainsKey('sdk') -and $settings['sdk'] -is [Collections.IDictionary] -and $settings['sdk'].ContainsKey('version')) {
              $sdkVersion = [string]$settings['sdk']['version']
            }
          }
          $extension = if ($windows) { 'ps1' } else { 'sh' }
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.$extension"
          Invoke-WebRequest "https://dot.net/v1/dotnet-install.$extension" -OutFile $installer
          $install = Join-Path $env:RUNNER_TEMP 'dotnet'
          $global:LASTEXITCODE = 0
          if ($windows) {
            if ($sdkVersion) { & $installer -Version $sdkVersion -InstallDir $install }
            else { & $installer -Channel '10.0' -InstallDir $install }
          } else {
            if ($sdkVersion) { & bash $installer --version $sdkVersion --install-dir $install }
            else { & bash $installer --channel '10.0' --install-dir $install }
          }
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK installation failed' }
          $dotnetName = if ($windows) { 'dotnet.exe' } else { 'dotnet' }
          $dotnet = Join-Path $install $dotnetName
          if (-not (Test-Path -LiteralPath $dotnet -PathType Leaf)) { throw '.NET SDK executable is missing' }
          & $dotnet --version
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK version check failed' }
          & $dotnet --info
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK runtime check failed' }
          $install | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$install" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Checkout app metadata
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Download build artifact
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          R2_ARTIFACT_RUN_ATTEMPT: ${{ fromJSON(inputs.build-attempts)[matrix.runtime] }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'ferry.${{ matrix.runtime }}' -Destination 'publish' -RunAttempt $env:R2_ARTIFACT_RUN_ATTEMPT
        working-directory: ${{ github.workspace }}
      - name: Extract tar
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        run: |
          tar -xf publish/ferry.${{ matrix.runtime }}.tar -C publish
          rm publish/ferry.${{ matrix.runtime }}.tar
      - name: Extract generated resources
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          cp publish/_resources/App.icns build/resources/app/App.icns
          rm -rf publish/_resources
      - name: Prepare macOS app metadata
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          sed "s/FERRY_VERSION/${{ inputs.version }}/g" build/resources/app/App.plist > Info.plist
      # rere レビュー #C-25/#F-10: vpk のバージョンが記録されていなかった。
      # vpk は macOS の codesign / productsign / notarytool 実行と自動更新フィード生成を担うので、
      # マイナー更新で nupkg / delta / releases.*.json の形式が変わると、その日以降の
      # リリースだけ特定 OS で自動更新が失敗しうる。にもかかわらず「どの vpk がこの nupkg を
      # 作ったか」がリリース成果物にも CI ログにも残っておらず、退行時に二分探索できなかった。
      # ローカル署名リリース (scripts/release-local.ps1) は解決した版をログに出しているので、
      # CI 側も最低限バージョンを記録してサマリに残し、対称にする。
      - name: Install Velopack CLI
        run: |
          dotnet tool install --global vpk
          vpk_version=$(vpk --version 2>&1 | head -1 || echo 'unknown')
          echo "vpk version: $vpk_version"
          echo "- \`${{ matrix.runtime }}\`: vpk $vpk_version" >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Create Velopack package (Linux)
        if: startsWith(matrix.runtime, 'linux-')
        run: >
          vpk pack
          --packId Ferry
          --packVersion ${{ inputs.version }}
          --mainExe ${{ matrix.mainExe }}
          --packDir publish
          --outputDir artifacts
          --channel ${{ matrix.runtime }}
          --icon build/resources/_common/icons/ferry.png
      - name: Apple 証明書を一時キーチェーンにインポート (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        env:
          APPLE_CERT_APP_P12_BASE64: ${{ secrets.APPLE_CERT_APP_P12_BASE64 }}
          APPLE_CERT_INSTALLER_P12_BASE64: ${{ secrets.APPLE_CERT_INSTALLER_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_APP_P12_BASE64:-}" ] || [ -z "${APPLE_CERT_INSTALLER_P12_BASE64:-}" ]; then
            echo "::error::Apple 証明書 Secret (APPLE_CERT_APP_P12_BASE64 / APPLE_CERT_INSTALLER_P12_BASE64) が未設定です。"
            echo "未署名 pkg は macOS Gatekeeper に弾かれます。手順: docs/operations/macos-signing.md"
            exit 1
          fi
          # GitHub ランナーの login.keychain を汚さないよう、専用の一時キーチェーンを使う。
          # パスワードはこのジョブ内でしか使わない使い捨て (ログにも出さない)。
          KEYCHAIN_PATH="$RUNNER_TEMP/ferry-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"   # 6h でロック (ジョブ内で完結)
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Application (.app 署名用) と Installer (.pkg 署名用) の 2 証明書を順にインポート
          for var in APPLE_CERT_APP_P12_BASE64 APPLE_CERT_INSTALLER_P12_BASE64; do
            p12="$RUNNER_TEMP/ferry-${var}.p12"
            eval "echo \"\${$var}\"" | base64 --decode > "$p12"
            security import "$p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm -f "$p12"
          done
          # codesign/productsign が UI プロンプト無しで秘密鍵を使えるようにする
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # vpk(codesign) がデフォルト検索でこのキーチェーンを見つけられるよう検索リスト先頭へ
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "FERRY_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          # 取り込んだ署名 identity を確認 (出力は証明書名のみ。秘密鍵は出ない)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: notarytool プロファイルを作成 (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # vpk が --notaryProfile で参照する名前付きプロファイルをキーチェーンに保存。
          # app-specific password 方式 (Apple ID + Team ID + appleid.apple.com 発行のアプリ用パスワード)。
          xcrun notarytool store-credentials "ferry-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$FERRY_KEYCHAIN_PATH"
      - name: Create Velopack package (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        # --signAppIdentity / --signInstallIdentity / --notaryProfile を渡すと vpk が
        # .app の codesign → .pkg の productsign → notarytool 公証申請 → stapler まで自動実行する。
        # entitlements は省略 = Velopack の .NET 向けデフォルト (hardened runtime + JIT 系許可) を使う。
        # AOT で公証が通らない場合のみ build/resources/app/App.entitlements を作って --signEntitlements を足す。
        run: >
          vpk pack
          --packId Ferry
          --packVersion ${{ inputs.version }}
          --mainExe ${{ matrix.mainExe }}
          --packDir publish
          --outputDir artifacts
          --channel ${{ matrix.runtime }}
          --icon build/resources/app/App.icns
          --plist Info.plist
          --signAppIdentity "${{ secrets.APPLE_SIGN_APP_IDENTITY }}"
          --signInstallIdentity "${{ secrets.APPLE_SIGN_INSTALL_IDENTITY }}"
          --notaryProfile ferry-notary
          --keychain "$FERRY_KEYCHAIN_PATH"
      - name: Download dependency evidence
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          R2_ARTIFACT_RUN_ATTEMPT: ${{ fromJSON(inputs.build-attempts)[matrix.runtime] }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'deps.${{ matrix.runtime }}' -Destination 'dependencies' -RunAttempt $env:R2_ARTIFACT_RUN_ATTEMPT
        working-directory: ${{ github.workspace }}
      - name: Install artifact inspection tools (Linux)
        if: startsWith(matrix.runtime, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: 配布実物と署名・公証を検証
        run: python3 build/scripts/verify-release.py feed --version '${{ inputs.version }}' --runtime '${{ matrix.runtime }}' --root artifacts --publish publish --evidence verification
      - name: Upload verification evidence
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'verification.feed.${{ matrix.runtime }}' -Path 'verification/*.json' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Upload Velopack artifact
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'velopack.${{ matrix.label }}' -Path 'artifacts/*' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Record artifact producer attempt
        id: artifact-attempt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_RUNTIME: ${{ matrix.runtime }}
        run: |
          printf '%s=%s\n' "$ARTIFACT_RUNTIME" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
