name: Relay Healthcheck

# rere レビュー #F-011: Cloudflare Workers Relay (https://watashiba.kagayoi.com)
# の /health endpoint を 15 分間隔で polling する。失敗時に Issue を自動作成して
# 「気付かないまま部分障害が続く」状態を防ぐ。
# 「200 を返し続けるが機能不全」の部分障害も検出するため、将来的には実 WebSocket
# 接続テストにも拡張する余地あり。

on:
  schedule:
    # 15 分間隔で実行 (Cloudflare Workers の billing 影響なし、cron は GitHub 側)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  issues: write  # 失敗時の Issue 作成のため

jobs:
  healthcheck:
    name: Relay /health endpoint check
    runs-on: ubuntu-latest
    steps:
      - name: /health の HTTP 200 を確認
        id: probe
        run: |
          set +e
          url="https://watashiba.kagayoi.com/health"
          error_file=$(mktemp)
          status=$(curl --silent --show-error --max-time 30 \
                       --retry 3 --retry-delay 5 --retry-all-errors \
                       --output /dev/null --write-out "%{http_code}" \
                       "$url" 2>"$error_file")
          curl_exit=$?
          curl_error=$(tr '\r\n' '  ' < "$error_file" | sed -E 's/[[:space:]]+/ /g' | cut -c1-1000)
          rm -f "$error_file"

          status=${status:-000}
          curl_error=${curl_error:-none}
          {
            echo "status=$status"
            echo "curl_exit=$curl_exit"
            echo "curl_error=$curl_error"
          } >> "$GITHUB_OUTPUT"

          if [[ "$curl_exit" -ne 0 || "$status" != "200" ]]; then
            echo "curl stderr: $curl_error"
            echo "::error::Relay /health に失敗しました (HTTP $status, curl exit $curl_exit)"
            exit 1
          fi
          echo "✅ Relay /health OK"

      # Codex P2 (#3318349018): labels が存在しないリポジトリで Issue 作成が 422 / 権限経路で
      # 失敗すると、初回 outage が「アラートが届かない」事故になる。
      # createLabel を idempotent に先行実行 (already-exists の 422 は無視) し、本作成 step は
      # 必ず labels 揃った状態で実行できるようにする。
      - name: ラベルが未存在なら事前作成 (idempotent)
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = [
              { name: 'relay-healthcheck', color: 'd73a4a', description: 'Cloudflare Workers Relay /health 監視' },
              { name: 'incident', color: 'b60205', description: '本番障害 / 過去のインシデント記録' },
              { name: 'auto-generated', color: 'cccccc', description: 'CI ワークフローが自動作成した Issue' },
            ];
            for (const lbl of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: lbl.name,
                  color: lbl.color,
                  description: lbl.description,
                });
                core.info(`Created label: ${lbl.name}`);
              } catch (e) {
                // 422 Unprocessable Entity = 既存ラベル → 想定内
                if (e.status === 422) {
                  core.info(`Label already exists: ${lbl.name}`);
                } else {
                  core.warning(`Label createLabel failed (${lbl.name}): ${e.status} ${e.message}`);
                }
              }
            }

      - name: 失敗時に Issue を作成
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEALTH_HTTP_STATUS: ${{ steps.probe.outputs.status }}
          HEALTH_CURL_EXIT: ${{ steps.probe.outputs.curl_exit }}
          HEALTH_CURL_ERROR: ${{ steps.probe.outputs.curl_error }}
        with:
          script: |
            const status = process.env.HEALTH_HTTP_STATUS || '000';
            const curlExit = process.env.HEALTH_CURL_EXIT || 'unknown';
            const curlError = (process.env.HEALTH_CURL_ERROR || 'none').replaceAll('`', "'");
            const title = `[Auto] Relay healthcheck failed (HTTP ${status}, curl ${curlExit})`;
            const body = `## 障害発生通知\n\n` +
              `- **時刻**: ${new Date().toISOString()}\n` +
              `- **HTTP ステータス**: ${status}\n` +
              `- **curl 終了コード**: ${curlExit}\n` +
              `- **curl エラー**: \`${curlError}\`\n` +
              `- **対象**: https://watashiba.kagayoi.com/health\n\n` +
              `## 確認手順\n\n` +
              `1. Cloudflare ステータス: https://www.cloudflarestatus.com/\n` +
              `2. wrangler tail で実時間ログ確認:\n` +
              `   \`\`\`bash\n` +
              `   cd infra/cloudflare/relay && wrangler tail --name ferry-relay\n` +
              `   \`\`\`\n` +
              `3. SALT secret が正しく設定されているか確認:\n` +
              `   \`\`\`bash\n` +
              `   cd infra/cloudflare/relay && wrangler secret list\n` +
              `   \`\`\`\n\n` +
              `## 復旧手順 (詳細は docs/operations/runbook.md シナリオ B 参照)\n\n` +
              `- 直前 deploy で発生したなら: \`wrangler rollback --name ferry-relay\`\n` +
              `- SALT 消失なら: \`wrangler secret put SALT\`\n\n` +
              `この Issue は relay-healthcheck workflow が自動作成しました。`;

            // 既存の未 close な auto-created issue があれば重複作成しない
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'relay-healthcheck',
              per_page: 5
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `## 再発通知\n\n` +
                  `- 時刻: ${new Date().toISOString()}\n` +
                  `- HTTP: ${status}\n` +
                  `- curl exit: ${curlExit}\n` +
                  `- curl error: \`${curlError}\``
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['relay-healthcheck', 'incident', 'auto-generated']
            });
