name: Relay Check

# infra/cloudflare/relay/ (TypeScript の Cloudflare Worker) を PR 段階で検証する。
#
# rere レビュー #C-05 の再発防止: 旧構成では relay の TypeScript を検証する経路が
# どの workflow にも存在せず、6 本の vitest スイートが一度も走っていなかった。
# dotnet-build.yml は .NET だけを見るため relay は素通りで、型エラーやテスト失敗が
# main にマージされ deploy-relay.yml でそのまま本番 (watashiba.kagayoi.com) へ
# 配信されうる状態だった。
#
# CLAUDE.md が relay の検証コマンドとして規定している
#   `pnpm exec tsc --noEmit && pnpm test`
# をそのまま CI のゲートにする。deploy-relay.yml (main への push) 側にも同じ
# ステップを置いてあるので、PR を経由しない直 push でも検証は外れない。
on:
  pull_request:
    branches: ["main"]
    paths:
      - 'infra/cloudflare/relay/**'
      - '.github/workflows/relay-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node.js セットアップ (wrangler 4.x が Node.js >=20 を要求)
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: pnpm をインストール (サプライチェーン対策でバージョン固定)
        run: npm install -g pnpm@11.4.0

      - name: 依存をインストール (lockfile 固定)
        working-directory: infra/cloudflare/relay
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        working-directory: infra/cloudflare/relay
        run: pnpm exec tsc --noEmit

      - name: テスト
        working-directory: infra/cloudflare/relay
        run: pnpm test
