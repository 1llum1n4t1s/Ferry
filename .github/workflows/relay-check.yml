name: Relay Check

# infra/cloudflare/relay/ (TypeScript の Cloudflare Worker) を PR 段階で検証する。
#
# rere レビュー #C-05 の再発防止: 旧構成では relay の TypeScript を検証する経路が
# どの workflow にも存在せず、6 本の vitest スイートが一度も走っていなかった。
# dotnet-build.yml は .NET だけを見るため relay は素通りで、型エラーやテスト失敗が
# main にマージされ deploy-relay.yml でそのまま本番 (watashiba.kagayoi.com) へ
# 配信されうる状態だった。
#
# AGENTS.md が relay の検証コマンドとして規定している
#   `bun run --bun tsc --noEmit && bun run --bun test`
# をそのまま CI のゲートにする。deploy-relay.yml (main への push) 側にも同じ
# ステップを置いてあるので、PR を経由しない直 push でも検証は外れない。
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'infra/cloudflare/relay/**'
      - '.github/workflows/relay-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bun セットアップ
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: 依存をインストール (lockfile 固定)
        working-directory: infra/cloudflare/relay
        run: |
          bun --no-env-file --no-install --bun run bun add --global --trust pnpm@12.16.1 --network-concurrency=4
          bun --no-env-file --no-install --bun run pnpm install --lockfile-only --frozen-lockfile --network-concurrency=4

      - name: Bun で製品依存を導入
        working-directory: infra/cloudflare/relay
        run: bun --no-env-file --no-install --bun run bun install --frozen-lockfile --no-save --network-concurrency=4

      - name: 型チェック
        working-directory: infra/cloudflare/relay
        run: bun run --bun tsc --noEmit

      - name: テスト
        working-directory: infra/cloudflare/relay
        run: bun run --bun test
