name: Deploy Firebase Rules

# src/Ferry.Bridge/database.rules.json を main に push したら Firebase Realtime Database の
# セキュリティルールを自動デプロイする。
#
# 再発防止の背景 (2026-06-23): release.yml の firebase-deploy は `--only hosting` で、
# database ルールは「Auth 浸透後に手動 deploy」という #D-001a Phase B 戦略で手動運用だった。
# その結果、厳格ルール (v2) が未デプロイのまま presence/sessions/signaling が未認証で
# 読める露出状態が放置された (presence 272 件公開)。手動運用が構造的原因のため CI 化する。
#
# 認証: Service Account JSON (release.yml の firebase-deploy と同じ FIREBASE_SERVICE_ACCOUNT_FERRY_EDF09)。
# ⚠️ そのSAは hosting deploy 用に `roles/firebasehosting.admin` のみ付与されている想定なので、
#    database ルールのデプロイには GCP IAM で **`roles/firebasedatabase.admin`** を追加付与する必要がある
#    (未付与だと firebase deploy が権限エラーで fail-loud する)。
on:
  push:
    branches: [main]
    paths:
      - 'src/Ferry.Bridge/database.rules.json'
      - 'src/Ferry.Bridge/firebase.json'
      - '.github/workflows/deploy-firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy RTDB rules
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Node.js セットアップ
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: firebase-tools をインストール (サプライチェーン対策でバージョン固定)
        run: npm install -g firebase-tools@14.11.0

      - name: Service Account JSON を書き出し
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERRY_EDF09 }}
        run: |
          set -euo pipefail
          if [ -z "${SA:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_FERRY_EDF09 が未設定です。RTDB ルールの deploy は必須。"
            echo "Firebase Console → プロジェクト設定 → サービスアカウント → 新しい秘密鍵を生成 で JSON を取得し、"
            echo "GitHub Secrets に登録してください。さらに GCP IAM で roles/firebasedatabase.admin を付与してください。"
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"

      # firebase CLI は GOOGLE_APPLICATION_CREDENTIALS (ADC) で SA 認証する。
      # firebase.json の "database": { "rules": "database.rules.json" } を参照して
      # `firebase deploy --only database` がルールのみ release する (hosting は触らない)。
      # ルールファイルは Firebase が受理する // コメントを含む (fix 4b4c3b9)。
      - name: RTDB ルールをデプロイ
        working-directory: src/Ferry.Bridge
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: firebase deploy --only database --project ferry-edf09 --non-interactive
