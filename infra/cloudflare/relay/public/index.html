<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferry - ペアリング</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .subtitle {
            color: #888;
            margin-bottom: 24px;
        }
        .status {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status-text {
            font-size: 1rem;
            margin-bottom: 8px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333;
            border-top-color: #0078d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 16px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .session-info {
            background: #0f3460;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: left;
        }
        .session-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .session-name {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
        }
        .session-id {
            font-family: monospace;
            font-size: 0.7rem;
            word-break: break-all;
            color: #888;
        }
        .check-mark {
            color: #51cf66;
        }

        /* ============================================================
           モード選択カード — ユーザーが明示的に手段を選ぶ初期画面
           カメラは「カメラで QR スキャン」を選んだ時だけ起動する。
           自動でカメラを起動しないことで「いきなり権限ダイアログ」の
           不安を解消する。
           ============================================================ */
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .mode-card {
            background: #16213e;
            border: 1px solid #2d4870;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, border-color 0.15s, transform 0.05s;
            font-family: inherit;
            color: inherit;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .mode-card:hover {
            background: #1d2e54;
            border-color: #0078d4;
        }
        .mode-card:active {
            transform: translateY(1px);
        }
        .mode-icon {
            font-size: 2rem;
            line-height: 1;
            flex-shrink: 0;
        }
        .mode-text {
            flex: 1;
        }
        .mode-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .mode-desc {
            font-size: 0.8rem;
            color: #aaa;
            line-height: 1.4;
        }

        /* ============================================================
           戻るリンク (モード選択画面に戻る)
           ============================================================ */
        .back-link {
            display: inline-block;
            color: #888;
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 12px;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }
        .back-link:hover {
            color: #0078d4;
        }

        /* ============================================================
           QR スキャナー
           ============================================================ */
        #qrReader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .scan-hint {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 12px;
        }

        /* ============================================================
           ボタン / エラー / 完了
           ============================================================ */
        .btn {
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .btn:hover { background: #106ebe; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .error-box {
            background: #2d1b1b;
            border: 1px solid #ff6b6b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .error { color: #ff6b6b; font-size: 1rem; word-break: break-word; }
        .success { color: #51cf66; font-size: 1.2rem; margin-bottom: 12px; }
        .paired-names { color: #ccc; font-size: 0.95rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ferry</h1>
        <p class="subtitle">P2P ファイル転送ペアリング</p>

        <!-- 接続元のセッション情報 (sid_A 検証後に表示) -->
        <div class="session-info hidden" id="sessionAInfo">
            <div class="session-info-row">
                <span class="check-mark">✓</span>
                <span style="color: #aaa; font-size: 0.85rem;">接続元の PC:</span>
                <span class="session-name" id="sessionAName"></span>
            </div>
            <p class="session-id" id="sessionAId"></p>
        </div>

        <!-- モード選択画面 (QR パラメータ検証完了後に表示) -->
        <div class="hidden" id="modePanel">
            <div class="mode-grid">
                <button type="button" class="mode-card" id="modeCameraBtn">
                    <span class="mode-icon">📷</span>
                    <div class="mode-text">
                        <div class="mode-title">カメラで QR スキャン</div>
                        <div class="mode-desc">
                            このデバイスのカメラを起動して、もう片方の PC の QR コードを読み取ります。<br>
                            スマートフォンでの利用に最適です。
                        </div>
                    </div>
                </button>
            </div>
        </div>

        <!-- カメラスキャンパネル (モード A 選択時のみ表示) -->
        <div class="hidden" id="scanPanel">
            <button type="button" class="back-link" id="backFromScan">← モード選択に戻る</button>
            <p class="scan-hint">ペアリング先の PC に表示されている QR コードにカメラを向けてください</p>
            <div id="qrReader"></div>
        </div>

        <!-- 進行状況パネル (初期表示 + ペアリング処理中) -->
        <div class="status" id="statusPanel">
            <p class="status-text" id="statusText">セッション情報を取得中…</p>
            <div class="spinner" id="spinner"></div>
            <p class="error hidden" id="errorDetail" style="margin-top: 12px; font-size: 0.9rem;"></p>
        </div>

        <!-- ペアリング完了 -->
        <div class="hidden" id="pairedPanel">
            <p class="success">✓ ペアリング完了</p>
            <p class="paired-names" id="pairedNames"></p>
            <p style="color: #888; font-size: 0.85rem; margin-top: 16px;">このページを閉じてください</p>
        </div>

        <!-- エラー表示 -->
        <div class="hidden" id="errorPanel">
            <div class="error-box">
                <p class="error" id="errorText"></p>
            </div>
            <button class="btn" onclick="location.reload()">再試行</button>
        </div>
    </div>

    <!-- CF 単独完結 (docs/design/cf-only-migration.md §5):
         このページは relay Worker の Static Assets で配信される唯一の Bridge。
         Firebase SDK は使わず、2 つの QR (sid+nonce) を読み取って同一オリジンの
         POST /pair/create を 1 回叩くだけでペアリングが成立する (nonce 所有が認可)。
         Worker が両 sid の nonce を D1 で server 検証し、両 PC の DeviceDO inbox(WS)へ push する。
         旧 Firebase 版 (src/Ferry.Bridge/) は Step 7 で撤去済み。 -->

    <!-- html5-qrcode ライブラリ（ページ内カメラでペアリング先の QR を読み取る） -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
            integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+"
            crossorigin="anonymous"></script>

    <script src="bridge.js"></script>
</body>
</html>
