name = "ferry-relay"
main = "src/index.ts"
compatibility_date = "2026-05-26"

# Workers Paid プラン必須 (Durable Objects 利用のため)。
# Workers Paid $5/月は RealTimeTranslator と共有想定。Ferry のリレー DO 自体は無料枠で収まる試算。

# workers.dev サブドメイン (ferry-relay.1llum1n4t1.workers.dev) と Preview URL を明示的に無効化。
# Custom Domain (relay.ferry.nephilim.jp) でのみ公開し、口を増やさない。
workers_dev = false
preview_urls = false

# === Durable Object ===
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDO"]

# === カスタムドメイン ===
# `relay.ferry.nephilim.jp` は Cloudflare Zone `nephilim.jp` (Yuro 所有) 配下。
# wrangler.toml からの自動接続には Token に `Account:Workers Scripts:Edit` と `Zone:Workers Routes:Edit` が必要 (既に付与済み)。
# DNS は Cloudflare が nephilim.jp Zone に自動で AAAA / CNAME を貼る。
[[routes]]
pattern = "relay.ferry.nephilim.jp"
custom_domain = true

# === #D-001a Phase B: Firebase Custom Token Auth ===

# Firebase Realtime DB URL (vars - 秘密ではないので環境変数として埋め込み)
[vars]
FIREBASE_DATABASE_URL = "https://ferry-edf09-default-rtdb.firebaseio.com"

# deviceId ↔ pubKeySpki binding KV (first-write-wins)
# 事前に: pnpm dlx wrangler kv namespace create DEVICE_KEY_BINDING で作成して id をここに貼る
[[kv_namespaces]]
binding = "DEVICE_KEY_BINDING"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Rate Limit bindings (unsafe.bindings)
# Cloudflare Rate Limit API (2024 Q4 GA)
[[unsafe.bindings]]
name = "RATELIMIT_IP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RATELIMIT_DEVICE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RATELIMIT_SESSION"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# secret は手動投入:
#   SA_PATH=$(node -p "require('C:/Users/IMT/dev/Secret/secrets.json').firebase.sa_key_path")
#   node -p "require('$SA_PATH').private_key" | pnpm dlx wrangler secret put FIREBASE_PRIVATE_KEY
#   node -p "require('$SA_PATH').client_email" | pnpm dlx wrangler secret put FIREBASE_CLIENT_EMAIL

# === Observability ===
# Workers 標準のメトリクス + Logpush 連携時の保管設定。
[observability]
enabled = true
head_sampling_rate = 1
