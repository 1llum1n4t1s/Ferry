name = "ferry-relay"
main = "src/index.ts"
compatibility_date = "2026-05-26"

# Workers Paid プラン必須 (Durable Objects 利用のため)。
# Workers Paid $5/月は RealTimeTranslator と共有想定。Ferry のリレー DO 自体は無料枠で収まる試算。

# workers.dev サブドメイン (ferry-relay.kagayoi.workers.dev) と Preview URL を明示的に無効化。
# Custom Domain (watashiba.kagayoi.com) でのみ公開し、口を増やさない。
workers_dev = false
preview_urls = false

# === CF 単独完結移行 Step 4: Bridge QR ページを Workers Static Assets で配信 ===
# public/ の index.html + bridge.js を Worker より先に配信し、API パス
# (/sig /pair /pairs /inbox /presence /auth /health /ferry-relay) は非アセットなので
# not_found_handling 既定 "none" で Worker にフォールスルーする。アセットパス (/, /bridge.js) と
# API パスは互いに素なので run_worker_first は不要 (誤って Worker を素通りさせない)。
# QR の宛先は AppConstants.CfBridgePageUrl = https://watashiba.kagayoi.com（API と同一オリジン → CORS 不要）。
[assets]
directory = "./public"

# === Durable Object ===
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

# CF 単独完結移行 Step 1 (docs/design/cf-only-migration.md): signaling DO (pairId-keyed)。
# offers/answers/endpoints/probes/createdAt を DO storage で強整合に保持し、alarm で TTL cleanup する。
[[durable_objects.bindings]]
name = "PAIR"
class_name = "PairDO"

# CF 単独完結移行 Step 2: device DO (deviceId-keyed)。presence(poll) + pairing inbox(WS push)。
[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PairDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DeviceDO"]

# === カスタムドメイン ===
# `watashiba.kagayoi.com` は Cloudflare Zone `kagayoi.com` (Yuro 所有) 配下。
# wrangler.toml からの自動接続には Token に `Account:Workers Scripts:Edit` と `Zone:Workers Routes:Edit` が必要 (既に付与済み)。
# DNS は Cloudflare が kagayoi.com Zone に自動で AAAA / CNAME を貼る。
[[routes]]
pattern = "watashiba.kagayoi.com"
custom_domain = true

# === CF 単独完結移行 Step 2: ペア台帳 D1 ===
# sessions / pairing_nonces / pairs を保持 (pairs は永続 SSoT、他は 1h stale)。
# 作成手順 (deploy 前に必須):
#   pnpm dlx wrangler d1 create ferry_ledger          # 出力の database_id を下に貼る
#   pnpm dlx wrangler d1 execute ferry_ledger --remote --file=schema.sql
# database_id は CF リソース識別子 (アクセスには API token + account 権限が要る) なので公開可。
[[d1_databases]]
binding = "DB"
database_name = "ferry_ledger"
# 2026-06-23 に APAC リージョン (東京 pin) で作成。database_id は CF リソース識別子なので公開可。
database_id = "05b906bc-0c78-470d-8afe-6ee41b273049"

# deviceId ↔ pubKeySpki binding KV (first-write-wins)
# Codex 第13弾 #4 (P1) fix: 旧 placeholder "REPLACE_WITH_KV_NAMESPACE_ID" のままだと deploy 後 /auth/token が
# DEVICE_KEY_BINDING undefined で動かないため、 1llum1n4t1 account 配下に作成済の KV namespace ID を貼る
# (`pnpm dlx wrangler kv namespace create DEVICE_KEY_BINDING` の出力)。
# namespace ID 自体は Cloudflare リソース識別子で、 アクセスには API token + account 権限が必要なので
# 公開しても security 上の悪化はない。
[[kv_namespaces]]
binding = "DEVICE_KEY_BINDING"
id = "1b36c961ac274a3385d7046df6cd7be9"

# Rate Limit bindings (unsafe.bindings)
# Cloudflare Rate Limit API (2024 Q4 GA)
[[unsafe.bindings]]
name = "RATELIMIT_IP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RATELIMIT_DEVICE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RATELIMIT_SESSION"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# secret は手動投入:
#   # CF 単独完結 (cf-only-migration): cfToken (自前 HMAC bearer) 署名鍵。ランダム 32 byte を投入（本番必須）。
#   openssl rand -hex 32 | pnpm dlx wrangler secret put SESSION_HMAC_SECRET
#
# 旧 Firebase Custom Token 用の FIREBASE_PRIVATE_KEY / FIREBASE_CLIENT_EMAIL は CF 単独完結 Step 7 で撤去済み。
# デプロイ後に `pnpm dlx wrangler secret delete FIREBASE_PRIVATE_KEY` / `... FIREBASE_CLIENT_EMAIL` で消すこと。

# === Observability ===
# Workers 標準のメトリクス + Logpush 連携時の保管設定。
[observability]
enabled = true
head_sampling_rate = 1

# 旧ドメイン（2027/05/31 の nephilim.jp 廃止まで併走）
[[routes]]
pattern = "relay.ferry.nephilim.jp"
custom_domain = true
